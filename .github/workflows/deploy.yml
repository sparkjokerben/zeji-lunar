# 每次 push 到 main：构建并部署 Pages（含 functions）+ Worker。
# 直接用仓库内 wrangler（npm ci 装到根 node_modules，4.x 需 Node ≥ 22）。
# 不用 cloudflare/wrangler-action@v3：其在 Node 20 下会自动降级安装 wrangler 3.90，
# 与工作区 workers-types 冲突导致 ERESOLVE。
name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build site
        run: npm run build -w site
        env:
          VITE_AUTH_TOKEN: ${{ secrets.VITE_AUTH_TOKEN }}

      - name: Deploy Pages
        run: cd site && npx wrangler pages deploy --branch=main --project-name=zeji-lunar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: cd worker && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
