# 每次 push 到 main：自动构建并部署 Pages（含 functions）+ Worker（纯 CLI，无需面板 Git 集成）
name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build site
        run: npm run build -w site
        env:
          VITE_AUTH_TOKEN: ${{ secrets.VITE_AUTH_TOKEN }}

      # site/wrangler.toml 含 pages_build_output_dir + KV 绑定，deploy 会连同 functions/ 一起部署
      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy --branch=main

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
